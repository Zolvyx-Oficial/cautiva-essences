<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu carrito — Cautiva Essences</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/logo.jpg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<div class="container page-header">
  <div class="eyebrow-line">Cautive Essences</div>
  <h1 data-i18n="cart.title"></h1>
</div>

<div class="container cart-layout">
  <div id="cart-items"></div>
  <div class="summary-card">
    <div class="summary-row total">
      <span data-i18n="cart.subtotal"></span>
      <span id="summary-subtotal">$0</span>
    </div>
    <a href="/checkout.html" id="checkout-link" class="btn btn-primary btn-block" style="margin-top:16px" data-i18n="cart.checkout"></a>
    <a href="/index.html" class="btn btn-outline btn-block" style="margin-top:10px" data-i18n="cart.continue"></a>
  </div>
</div>

<footer id="site-footer" class="site-footer"></footer>

<script src="/js/app.js"></script>
<script src="/js/cart.js"></script>
</body>
</html>
