<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva contraseña — Essenza Studio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/img/logo.jpg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="admin-login-wrap">
  <div class="admin-login-card">
    <div class="eyebrow-line">Essenza Studio · Admin</div>
    <h2>Crear nueva contraseña</h2>
    <div id="msg-box" class="alert" style="display:none"></div>
    <form id="reset-form">
      <div class="form-field">
        <label>Nueva contraseña</label>
        <div style="position:relative">
          <input type="password" id="password-input" name="newPassword" required minlength="8" style="width:100%;padding-right:40px;box-sizing:border-box">
          <button type="button" id="toggle-password" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:13px;color:#aaa">Ver</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Guardar nueva contraseña</button>
    </form>
  </div>
</div>
<script>
document.getElementById('toggle-password').addEventListener('click', () => {
  const input = document.getElementById('password-input');
  const btn = document.getElementById('toggle-password');
  const isHidden = input.type === 'password';
  input.type = isHidden ? 'text' : 'password';
  btn.textContent = isHidden ? 'Ocultar' : 'Ver';
});

const params = new URLSearchParams(location.search);
const token = params.get('token');
const email = params.get('email');

document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const msgBox = document.getElementById('msg-box');
  try {
    const res = await fetch('/admin/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, token, newPassword: form.newPassword.value })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    msgBox.className = 'alert alert-success';
    msgBox.textContent = 'Contraseña actualizada. Redirigiendo al login...';
    msgBox.style.display = 'block';
    setTimeout(() => location.href = '/admin/login.html', 2000);
  } catch (err) {
    msgBox.className = 'alert alert-error';
    msgBox.textContent = err.message;
    msgBox.style.display = 'block';
  }
});
</script>
</body>
</html>
