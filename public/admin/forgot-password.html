<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar contraseña — Essenza Studio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/img/logo.jpg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="admin-login-wrap">
  <div class="admin-login-card">
    <div class="eyebrow-line">Essenza Studio · Admin</div>
    <h2>Recuperar contraseña</h2>
    <div id="msg-box" class="alert" style="display:none"></div>
    <form id="forgot-form">
      <div class="form-field">
        <label>Correo</label>
        <input type="email" name="email" required autocomplete="username">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Enviar enlace</button>
    </form>
    <p style="margin-top:16px;text-align:center"><a href="/admin/login.html" style="color:var(--gold);font-size:.85rem">Volver a iniciar sesión</a></p>
  </div>
</div>
<script>
document.getElementById('forgot-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const msgBox = document.getElementById('msg-box');
  const btn = form.querySelector('button');
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  try {
    const res = await fetch('/admin/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: form.email.value })
    });
    const data = await res.json();
    msgBox.className = 'alert alert-success';
    msgBox.textContent = 'Si el correo existe, te llegará un enlace en unos minutos. Revisa también spam.';
    msgBox.style.display = 'block';
    form.reset();
  } catch (err) {
    msgBox.className = 'alert alert-error';
    msgBox.textContent = 'Algo salió mal, intenta de nuevo.';
    msgBox.style.display = 'block';
  }
  btn.disabled = false;
  btn.textContent = 'Enviar enlace';
});
</script>
</body>
</html>
