<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<link rel="icon" href="/img/logo.jpg">

<!-- OpenGraph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cautiva Essences">

<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="/css/style.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Store",
  "name": "Cautiva Essences",
  "image": "/img/logo.jpg",
  "description": "Perfumería fina árabe, de nicho y de diseñador con despacho desde Rionegro, Antioquia para toda Colombia.",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Rionegro",
    "addressRegion": "Antioquia",
    "addressCountry": "CO"
  },
  "telephone": "+573196812111",
  "priceRange": "$$"
}
</script>
</head>
<body>
<header id="site-header" class="site-header"></header>

<section class="hero">
  <div class="container hero-grid">
    <div>
      <div class="eyebrow-line" data-i18n="hero.eyebrow"></div>
      <h1><span data-i18n="hero.title_pre"></span> <span data-i18n="hero.title_it"></span></h1>
      <p class="hero-lede" data-i18n="hero.lede"></p>
      <div class="hero-ctas">
        <a href="#catalogo" class="btn btn-primary" data-i18n="hero.cta_shop"></a>
        <a href="https://wa.me/573196812111" target="_blank" rel="noopener" class="btn btn-outline" data-i18n="hero.cta_whatsapp"></a>
      </div>
    </div>
    <div class="hero-visual">
      <video class="hero-visual-video" autoplay muted loop playsinline>
        <source src="/video/hero.mp4" type="video/mp4">
      </video>
      <div class="hero-visual-overlay"></div>
      <span class="center-mark">Cautiva Essences</span>
      <div class="frame-label">
        <span data-i18n="hero.frame_left"></span>
        <span data-i18n="hero.frame_right"></span>
      </div>
    </div>
  </div>
</section>

<section class="catalog-section" id="catalogo">
  <div class="container">
        <div class="wholesale-banner" id="wholesale-banner">
      <span id="wholesale-banner-text"></span>
      <button class="btn btn-outline" id="wholesale-banner-btn">Ver precios al por mayor</button>
    </div>
    <div class="catalog-toolbar">
      <div class="filter-group" id="category-chips"></div>
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
        <label class="wholesale-toggle">
          <input type="checkbox" id="wholesale-toggle">
          <span data-i18n="catalog.wholesale_toggle"></span>
        </label>
        <div class="search-box">
          <span>🔍</span>
          <input type="text" id="search-input" data-i18n-placeholder="catalog.search_placeholder" placeholder="Buscar perfume o marca...">
        </div>
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:24px;flex-wrap:wrap">
      <span style="color:var(--smoke);font-size:.85rem">Precio:</span>
      <input type="number" id="min-price-input" placeholder="Mín" style="width:100px;background:var(--carbon);border:1px solid var(--carbon-line);border-radius:var(--radius-sm);padding:8px 10px;color:var(--white)">
      <span style="color:var(--smoke)">–</span>
      <input type="number" id="max-price-input" placeholder="Máx" style="width:100px;background:var(--carbon);border:1px solid var(--carbon-line);border-radius:var(--radius-sm);padding:8px 10px;color:var(--white)">
    </div>
    <div class="product-grid" id="product-grid"></div>
    <div style="text-align:center;margin-top:32px">
      <button id="load-more-btn" class="btn btn-outline" style="display:none">Cargar más</button>
    </div>
  </div>
</section>

<footer id="site-footer" class="site-footer"></footer>

<script src="/js/app.js"></script>
<script src="/js/catalog.js"></script>
</body>
</html>
